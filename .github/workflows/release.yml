name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for NuGet Trusted Publishing: lets the job request a GitHub OIDC
  # token that NuGet.org exchanges for a short-lived publishing key.
  id-token: write

jobs:
  release:
    name: Pack & publish
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Derive version from tag
        id: version
        # Strip the leading "v" from the tag (e.g. v1.2.3 -> 1.2.3).
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore AgentRecall.slnx

      - name: Build
        run: >-
          dotnet build AgentRecall.slnx
          --configuration "$CONFIGURATION"
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test AgentRecall.slnx --configuration "$CONFIGURATION" --no-build

      - name: Pack
        run: >-
          dotnet pack src/AgentRecall.Cli/AgentRecall.Cli.csproj
          --configuration "$CONFIGURATION"
          --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet.org API key. No long-lived secret is stored in the repo.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: >-
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
