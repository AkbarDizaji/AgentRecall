name: Mutation testing (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-test:
    name: Mutation testing (Stryker, full run)
    runs-on: ubuntu-latest
    # Mutation testing is exploratory, not a merge gate: report the score without
    # failing the workflow on it.
    continue-on-error: true

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore AgentRecall.slnx

      - name: Run Stryker (full project)
        # The per-push/PR job in ci.yml only mutates changed files (--since) to keep
        # CI fast; this unscoped nightly run catches drift in mutation score across
        # the whole AgentRecall.Core project.
        working-directory: src/AgentRecall.Core
        run: dotnet stryker --config-file stryker-config.json

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-nightly
          path: src/AgentRecall.Core/StrykerOutput/**/reports/*
          if-no-files-found: warn
